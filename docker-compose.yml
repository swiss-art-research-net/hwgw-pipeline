services:

  researchspace:
    image: swissartresearx/researchspace:d3772173099ab67bd0cccd02ea8127b979e59add
    container_name: ${PROJECT_NAME}_researchspace
    restart: unless-stopped
    environment:
      PLATFORM_OPTS: >-
        -Dconfig.environment.sparqlEndpoint=http://blazegraph:8080/blazegraph/sparql
        -Dlog4j.configurationFile=classpath:org/researchspace/logging/log4j2.xml
      #   # ${RESEARCHSPACE_OPTS}
      # JAVA_OPTS: ${RESEARCHSPACE_JAVA_OPTS}
    volumes:
        # runtime data folder with config files and ad-hoc templates 
        - researchspace-data:/runtime-data
    depends_on:
      - blazegraph 
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"

  blazegraph:
    image: robcast/researchspace-blazegraph:2.2.0-jre17
    container_name: ${PROJECT_NAME}_blazegraph
    restart: unless-stopped
    # environment:
      # JAVA_OPTS: ${BLAZEGRAPH_JAVA_OPTS}
    volumes:
      - blazegraph-data:/blazegraph-data
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"

  jobs:
    build: ./services/jobs
    container_name: ${PROJECT_NAME}_jobs
    restart: unless-stopped
    volumes:
      - ./mapping:/mapping
      - ./data:/data
      - ./hwgw-data:/hwgw-data
      - ./logs:/logs
      - ./scripts:/scripts
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - COMPOSE_PROJECT_NAME=${PROJECT_NAME}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"

volumes:
  researchspace-data:
  blazegraph-data: