version: '3'

vars:
  X3ML_ENDPOINT: http://localhost:8089/transform
  GENERATOR_POLICY: /mapping/generator-policy.xml
  NAMESPACE: http://hwgw.uzh.ch/
  REGISTERS: bibliography,objects,organizations,persons,places
  SCHRIFTEN: 01,03,04 # 01,02,03,04,06,08
  SOURCE_FOLDER: /dts_source
  DTS_FOLDER: /dts_data
  HWGW_DTS_ROOT: /external/hwgw-dts
  MODULES: objects,organizations,persons,places
  # Set for all dts-* tasks, so they don't mix local/remote data
  DTS_ENTRYPOINT: http://dapytains:4000/
  DTS_OUTPUT_PREFIX: local_hwgw

dotenv: 
  - /.env


tasks:
  default:
    desc: Default task
    silent: true
    interactive: true
    cmds:
      - task: download-all-data
      - task: prepare-dts-catalog-data
      - task: prepare-and-perform-mapping-for-items
      - task: generate-entity-index
      - task: dts-build-full-rdf

  generate-entity-index:
    desc: Generate CSV index of mapped person/object/org/place entities and URIs
    vars:
      REGISTER_ROOT:
        sh: echo "${REGISTER_ROOT:-/dts_source/registers}"
      MAPPING_ROOT:
        sh: echo "${MAPPING_ROOT:-/mapping}"
      OUTPUT:
        sh: echo "${OUTPUT:-/mapping/register-entity-index.csv}"
    cmds:
      - python generateEntityIndex.py
        --persons-xml {{.REGISTER_ROOT}}/persons/persons.xml
        --organizations-xml {{.REGISTER_ROOT}}/organizations/organizations.xml
        --places-xml {{.REGISTER_ROOT}}/places/places.xml
        --objects-xml {{.REGISTER_ROOT}}/objects/objects.xml
        --persons-mapping {{.MAPPING_ROOT}}/mapping-persons.x3ml
        --organizations-mapping {{.MAPPING_ROOT}}/mapping-organizations.x3ml
        --places-mapping {{.MAPPING_ROOT}}/mapping-places.x3ml
        --objects-mapping {{.MAPPING_ROOT}}/mapping-objects.x3ml
        --generator-policy {{.MAPPING_ROOT}}/generator-policy.xml
        --output {{.OUTPUT}}

  
  download-all-data:
    desc: Download all data from GitHub
    interactive: true
    vars:
      DOWNLOAD_WHAT: "all"
    cmds:
      - echo "Downloading all data from GitHub..."
      - mkdir -p {{.SOURCE_FOLDER}}
      - echo "Downloading Schriften..."
      - for:
          var: SCHRIFTEN
          split: ','
          as: SCHRIFT
        task: _download_individual_schrift_file_from_github
        vars:
          FILE_TYPE: "{{.SCHRIFT}}"
          PARTS: app,app-notiz,ed,in
      - echo "Downloading REGISTERS..."
      - for:
          var: REGISTERS
          split: ','
          as: REGISTER
        task: _download_individual_register_file_from_github
        vars:
          FILE_TYPE: "{{.REGISTER}}"

  _download_individual_register_file_from_github:
    internal: true
    silent: true
    requires:
      vars: [FILE_TYPE]
    vars:
      FILEPATH: "hw-anno/data/registers/{{.FILE_TYPE}}.xml" # ex. hw-anno/data/registers/bibliography.xml
      LOCAL_FOLDER: "{{.SOURCE_FOLDER}}/registers/{{.FILE_TYPE}}" # ex. /dts_source/registers/bibliography
      LOCAL_PATH: "{{.LOCAL_FOLDER}}/{{.FILE_TYPE}}.xml" # ex. /dts_source/registers/bibliography/bibliography.xml
    cmds:
      - mkdir -p {{.LOCAL_FOLDER}}
      - python getFileContentsFromGit.py {{.GITHUB_USERNAME}} {{.GITHUB_PERSONAL_ACCESS_TOKEN}} biblhertz/hwgw-anno-data {{.FILEPATH}} {{.LOCAL_PATH}} staging


  _download_individual_schrift_file_from_github:
    internal: true
    requires:
      vars: [FILE_TYPE, PARTS]
    cmds:
      - for:
          var: PARTS
          split: ','
          as: PART
        task: _download_individual_schrift_part_file_from_github
        vars:
          PART: "{{.PART}}"
          FILE_TYPE: "{{.FILE_TYPE}}"

  _download_individual_schrift_part_file_from_github:
    internal: true
    silent: true
    requires:
      vars: [FILE_TYPE, PART]
    vars:
      FILEPATH: "hw-anno/data/s{{.FILE_TYPE}}/s{{.FILE_TYPE}}-{{.PART}}.xml" # ex. hw-anno/data/s01/s01-app.xml
      LOCAL_FOLDER: "{{.SOURCE_FOLDER}}/s{{.FILE_TYPE}}" # ex. /dts_source/s01
      LOCAL_PATH: "{{.LOCAL_FOLDER}}/s{{.FILE_TYPE}}-{{.PART}}.xml" # ex. /dts_source/s01/s01-app.xml
    cmds:
      - mkdir -p {{.LOCAL_FOLDER}}
      - python getFileContentsFromGit.py {{.GITHUB_USERNAME}} {{.GITHUB_PERSONAL_ACCESS_TOKEN}} biblhertz/hwgw-anno-data {{.FILEPATH}} {{.LOCAL_PATH}} staging

# MAPPING
  prepare-and-perform-mapping-for-items:
    desc: Prepares and performs the mapping for all modules
    vars:
      MAPPING_INPUTFOLDER:
        sh: echo "/mapping/input"
    cmds:
      - echo "Preparing mapping..."
      - for:
          var: MODULES
          split: ','
          as: MODULE
        task: _prepare-mapping-for-module-items
        vars:
          MODULE: "{{.MODULE}}"
      - echo "Mapping..."
      - echo "" > /logs/mapping-log.log
      - for:
          var: MODULES
          split: ','
          as: MODULE
        task: _perform-mapping-for-module-items
        vars:
          MODULE: "{{.MODULE}}"
      - find {{.MAPPING_INPUTFOLDER}} -maxdepth 1 -name "*.xml" -delete


  prepare-mapping-for-module-items:
    desc: Prepares the mapping for a specific module. The module name should be passed as an argument or via the MODULE variable.
    interactive: True
    vars:
      MODULE:
        sh: |
          if [ -z "{{.MODULE}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            echo "{{.MODULE}}"
          fi
    cmds:
      - task: _prepare-mapping-for-module-items
        vars:
          MODULE: "{{.MODULE}}"
          
  perform-mapping-for-module-items:
    desc: Performs the mapping for a specific module. The module name should be passed as an argument or via the MODULE variable.
    interactive: True
    vars:
      MODULE:
        sh: |
          if [ -z "{{.MODULE}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            echo "{{.MODULE}}"
          fi
    cmds:
      - task: _perform-mapping-for-module-items
        vars:
          MODULE: "{{.MODULE}}"

  _prepare-mapping-for-module-items:
    requires:
      vars: [MODULE]
    vars:
      MODULE: "{{.MODULE}}"
      INPUTFOLDER:
        sh: echo "/dts_source/registers/$(echo "{{.MODULE}}")"
      OUTPUTFOLDER:
        sh: echo "/mapping/input/$(echo "{{.MODULE}}")"
    cmds:
      - mkdir -p {{.OUTPUTFOLDER}}
      - find {{.OUTPUTFOLDER}} -maxdepth 1 -name "*.xml" -delete
      - python prepareDataForMapping.py --module {{.MODULE}} --inputFolder {{.INPUTFOLDER}} --outputFolder {{.OUTPUTFOLDER}} {{.CLI_ARGS}}

  
  prepare-dts-catalog-data:
    desc: Prepares the data for the DTS catalog. This includes creating the collection XML and preparing the TEI files.
    # NOTE: dapytains reads the catalog (DTSCATALOG) at container startup, so after
    # this task changes the catalog / TEI files (e.g. adding a SCHRIFTEN such as s04),
    # the running dapytains service keeps serving the OLD catalog and returns 404 for
    # new collections until it is restarted. Restart it before the harvest/index steps,
    # from the host:  docker compose restart dapytains
    vars:
      INPUTFOLDER: "{{.SOURCE_FOLDER}}"
      OUTPUTFOLDER: "{{.DTS_FOLDER}}/tei/hwgw-edition"
      CATALOGFOLDER: "{{.DTS_FOLDER}}/catalog/hwgw-edition"
    cmds:
      - mkdir -p {{.OUTPUTFOLDER}}
      - mkdir -p {{.CATALOGFOLDER}}
      - find {{.OUTPUTFOLDER}} -maxdepth 1 -name "*.xml" -delete
      - find {{.CATALOGFOLDER}} -maxdepth 1 -name "*.xml" -delete
      - python prepareDtsData.py --catalog {{.CATALOGFOLDER}} --inputFolder {{.INPUTFOLDER}} --outputFolder {{.OUTPUTFOLDER}} {{.CLI_ARGS}}

  dts-harvest-jsonld:
    desc: Harvest JSON-LD from a DTS endpoint using external/hwgw-dts and write a Turtle file.
    vars:
      ENTRYPOINT: '{{if .ENTRYPOINT}}{{.ENTRYPOINT}}{{else}}{{.DTS_ENTRYPOINT}}{{end}}'
      COLLECTION_ID: '{{if .COLLECTION_ID}}{{.COLLECTION_ID}}{{else}}https://example.org/dts/collections/hwgw{{end}}'
      OUTPUT: '{{if .OUTPUT}}{{.OUTPUT}}{{else}}{{.HWGW_DTS_ROOT}}/data/output/dts_harvest.ttl{{end}}'
      LOG_FILE: '{{if .LOG_FILE}}{{.LOG_FILE}}{{else}}{{.HWGW_DTS_ROOT}}/data/output/dts_harvest.log{{end}}'
    cmds:
      - mkdir -p {{.HWGW_DTS_ROOT}}/data/output
      - python {{.HWGW_DTS_ROOT}}/scripts/harvest_jsonld_to_ttl.py --entrypoint "{{.ENTRYPOINT}}" --collection-id "{{.COLLECTION_ID}}" --output "{{.OUTPUT}}" --log-file "{{.LOG_FILE}}" {{.CLI_ARGS}}

  dts-build-entities-passages-index:
    desc: Build one entities-passages CSV index from all resources declared in the selected HWGW volume catalogs.
    vars:
      ENTRYPOINT: '{{if .ENTRYPOINT}}{{.ENTRYPOINT}}{{else}}{{.DTS_ENTRYPOINT}}{{end}}'
      RESOURCE_LIST: # e.g. s01/app, s01/ed, s01/in, s03/app, ...
        sh: |
          if [ -n "{{.RESOURCE_ID}}" ]; then
            printf '%s\n' "{{.RESOURCE_ID}}"
          elif [ -n "{{.RESOURCE_IDS}}" ]; then
            printf '%s\n' "{{.RESOURCE_IDS}}" | tr ',' '\n'
          else
            for schrift in $(printf '%s' "{{.SCHRIFTEN}}" | tr ',' ' '); do
              catalog="{{.DTS_FOLDER}}/catalog/hwgw-edition/s${schrift}.xml"
              if [ -f "$catalog" ]; then
                sed -n 's/.*<resource identifier="\([^"]*\)".*/\1/p' "$catalog"
              fi
            done
          fi
      OUTPUT: '{{if .OUTPUT}}{{.OUTPUT}}{{else}}{{.HWGW_DTS_ROOT}}/data/output/entities_passages.csv{{end}}'
      LOG_FILE: '{{if .LOG_FILE}}{{.LOG_FILE}}{{else}}{{.HWGW_DTS_ROOT}}/data/output/entities_passages.log{{end}}'
      PART_DIR: '{{.OUTPUT}}.parts'
    cmds:
      - mkdir -p {{.HWGW_DTS_ROOT}}/data/output
      - mkdir -p "{{.PART_DIR}}"
      - rm -f "{{.OUTPUT}}" "{{.LOG_FILE}}" "{{.PART_DIR}}"/*.csv "{{.PART_DIR}}"/*.log
      - for:
          var: RESOURCE_LIST
          split: "\n"
          as: RESOURCE_ID
          parallel: false
        task: _dts-build-entities-passages-index-for-resource
        vars:
          ENTRYPOINT: "{{.ENTRYPOINT}}"
          RESOURCE_ID: "{{.RESOURCE_ID}}"
          OUTPUT_DIR: "{{.PART_DIR}}"
          CLI_ARGS: "{{.CLI_ARGS}}"
      - |
        set -eu
        first=true
        # iterates over every per-resource CSV file produced by the earlier 
        # loop (each named like entities_passages_https___example.org_..._s01_app.csv)
        for part in "{{.PART_DIR}}/entities_passages_"*.csv; do
          [ -f "$part" ] || continue
          if $first; then
            cp "$part" "{{.OUTPUT}}"
            first=false
          else
            tail -n +2 "$part" >> "{{.OUTPUT}}"
          fi
          cat "${part%.csv}.log" >> "{{.LOG_FILE}}"
        done
        if $first; then
          echo "No DTS resources found in the selected catalogs." >&2
          exit 1
        fi
        # Parts are fully merged into OUTPUT/LOG_FILE above; remove parts dir once the merge succeeds
        rm -rf "{{.PART_DIR}}"

  _dts-build-entities-passages-index-for-resource:
    internal: true
    requires:
      vars: [ENTRYPOINT, RESOURCE_ID, OUTPUT_DIR]
    vars:
      SAFE_NAME:
        sh: printf '%s' "{{.RESOURCE_ID}}" | tr '/:' '__'
    cmds:
      - python {{.HWGW_DTS_ROOT}}/scripts/build_entities_passages_index.py
          --entrypoint "{{.ENTRYPOINT}}"
          --resource-id "{{.RESOURCE_ID}}"
          --tree published_page
          --cite-type page
          --output "{{.OUTPUT_DIR}}/entities_passages_{{.SAFE_NAME}}.csv"
          --log-file "{{.OUTPUT_DIR}}/entities_passages_{{.SAFE_NAME}}.log" {{.CLI_ARGS}}

  dts-build-combined-rdf:
    desc: Harvest, index, combine and verify HWGW RDF from a DTS endpoint (no RDS enrichment); writes only to external/hwgw-dts/data/output.
    vars:
      ENTRYPOINT: '{{if .ENTRYPOINT}}{{.ENTRYPOINT}}{{else}}{{.DTS_ENTRYPOINT}}{{end}}'
      VIEWER_WORKAROUND: '{{if .VIEWER_WORKAROUND}}{{.VIEWER_WORKAROUND}}{{else}}false{{end}}'
      COLLECTION_ID: '{{if .COLLECTION_ID}}{{.COLLECTION_ID}}{{else}}https://example.org/dts/collections/hwgw{{end}}'
      RESOURCE_IDS: '{{if .RESOURCE_IDS}}{{.RESOURCE_IDS}}{{end}}'
      RESOURCE_ID: '{{if .RESOURCE_ID}}{{.RESOURCE_ID}}{{end}}'
      TREE: '{{if .TREE}}{{.TREE}}{{else}}published_page{{end}}'
      CITE_TYPE: '{{if .CITE_TYPE}}{{.CITE_TYPE}}{{else}}page{{end}}'
      OUTPUT_PREFIX: '{{if .OUTPUT_PREFIX}}{{.OUTPUT_PREFIX}}{{else}}{{.DTS_OUTPUT_PREFIX}}{{end}}'
      OUTPUT_DIR: '{{if .OUTPUT_DIR}}{{.OUTPUT_DIR}}{{else}}{{.HWGW_DTS_ROOT}}/data/output{{end}}'
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - python {{.HWGW_DTS_ROOT}}/scripts/harvest_jsonld_to_ttl.py --entrypoint "{{.ENTRYPOINT}}" {{if eq .VIEWER_WORKAROUND "true"}}--endpoint-style concrete{{end}} --collection-id "{{.COLLECTION_ID}}" --output "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_harvest.ttl" --log-file "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_harvest.log"
      - task: dts-build-entities-passages-index
        vars:
          ENTRYPOINT: '{{.ENTRYPOINT}}'
          RESOURCE_IDS: '{{.RESOURCE_IDS}}'
          RESOURCE_ID: '{{.RESOURCE_ID}}'
          OUTPUT: '{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_entities_passages.csv'
          LOG_FILE: '{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_entities_passages.log'
      - python {{.HWGW_DTS_ROOT}}/scripts/combine_entity_graph.py --ttl "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_harvest.ttl" --entities-passages "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_entities_passages.csv" --external-index /mapping/register-entity-index.csv --output "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_combined.ttl" --log-file "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_combine.log"
      - python {{.HWGW_DTS_ROOT}}/scripts/verify_pipeline.py --harvest-ttl "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_harvest.ttl" --harvest-log "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_harvest.log" --entities-passages "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_entities_passages.csv" --external-index /mapping/register-entity-index.csv --combined-ttl "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_combined.ttl" --log-file "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_verify.log"

  dts-add-rds-links:
    desc: Build a standalone owl:sameAs Turtle graph (_rds_links.ttl) from RDS matches, kept separate from the DTS combined graph.
    vars:
      OUTPUT_PREFIX: '{{if .OUTPUT_PREFIX}}{{.OUTPUT_PREFIX}}{{else}}{{.DTS_OUTPUT_PREFIX}}{{end}}'
      OUTPUT_DIR: '{{if .OUTPUT_DIR}}{{.OUTPUT_DIR}}{{else}}{{.HWGW_DTS_ROOT}}/data/output{{end}}'
      RDS_ENDPOINT: '{{.RDS_ENDPOINT | default "https://reconcile.rds.swissartresearch.net/"}}'
      RDS_BATCH_SIZE: '{{if .RDS_BATCH_SIZE}}{{.RDS_BATCH_SIZE}}{{else}}100{{end}}'
    cmds:
      - python enrich_with_rds.py --external-index /mapping/register-entity-index.csv --endpoint "{{.RDS_ENDPOINT}}" --batch-size "{{.RDS_BATCH_SIZE}}" --output "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_rds_links.ttl" --log-file "{{.OUTPUT_DIR}}/{{.OUTPUT_PREFIX}}_rds_enrichment.log"

  dts-build-full-rdf:
    desc: Full pipeline - build combined HWGW RDF (dts-build-combined-rdf) and a separate RDS owl:sameAs graph (dts-add-rds-links).
    vars:
      ENTRYPOINT: '{{if .ENTRYPOINT}}{{.ENTRYPOINT}}{{else}}{{.DTS_ENTRYPOINT}}{{end}}'
      VIEWER_WORKAROUND: '{{if .VIEWER_WORKAROUND}}{{.VIEWER_WORKAROUND}}{{else}}false{{end}}'
      COLLECTION_ID: '{{if .COLLECTION_ID}}{{.COLLECTION_ID}}{{else}}https://example.org/dts/collections/hwgw{{end}}'
      RESOURCE_IDS: '{{if .RESOURCE_IDS}}{{.RESOURCE_IDS}}{{end}}'
      RESOURCE_ID: '{{if .RESOURCE_ID}}{{.RESOURCE_ID}}{{end}}'
      TREE: '{{if .TREE}}{{.TREE}}{{else}}published_page{{end}}'
      CITE_TYPE: '{{if .CITE_TYPE}}{{.CITE_TYPE}}{{else}}page{{end}}'
      OUTPUT_PREFIX: '{{if .OUTPUT_PREFIX}}{{.OUTPUT_PREFIX}}{{else}}{{.DTS_OUTPUT_PREFIX}}{{end}}'
      OUTPUT_DIR: '{{if .OUTPUT_DIR}}{{.OUTPUT_DIR}}{{else}}{{.HWGW_DTS_ROOT}}/data/output{{end}}'
      RDS_ENDPOINT: '{{.RDS_ENDPOINT | default "https://reconcile.rds.swissartresearch.net/"}}'
      RDS_BATCH_SIZE: '{{if .RDS_BATCH_SIZE}}{{.RDS_BATCH_SIZE}}{{else}}100{{end}}'
    cmds:
      - task: dts-build-combined-rdf
        vars:
          ENTRYPOINT: '{{.ENTRYPOINT}}'
          VIEWER_WORKAROUND: '{{.VIEWER_WORKAROUND}}'
          COLLECTION_ID: '{{.COLLECTION_ID}}'
          RESOURCE_IDS: '{{.RESOURCE_IDS}}'
          RESOURCE_ID: '{{.RESOURCE_ID}}'
          TREE: '{{.TREE}}'
          CITE_TYPE: '{{.CITE_TYPE}}'
          OUTPUT_PREFIX: '{{.OUTPUT_PREFIX}}'
          OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      - task: dts-add-rds-links
        vars:
          OUTPUT_PREFIX: '{{.OUTPUT_PREFIX}}'
          OUTPUT_DIR: '{{.OUTPUT_DIR}}'
          RDS_ENDPOINT: '{{.RDS_ENDPOINT}}'
          RDS_BATCH_SIZE: '{{.RDS_BATCH_SIZE}}'

  _perform-mapping-for-module-items:
      internal: true
      requires:
        vars: [MODULE]
      vars:
        INPUTFOLDER:
          sh: echo "/mapping/input/$(echo "{{.MODULE}}" | awk '{print tolower($0)}')"
        OUTPUTFOLDER:
          sh: echo "/mapping/output/$(echo "{{.MODULE}}" | awk '{print tolower($0)}')"
        MAPPINGFILE:
          sh: echo "/mapping/mapping-$(echo "{{.MODULE}}" | awk '{print tolower($0)}').x3ml"
        MAX_MAPPING_LOG_LINES: 500000
      cmds:
        - echo "Performing mapping for {{.MODULE}}..."
        - mkdir -p /mapping/output
        - mkdir -p {{.OUTPUTFOLDER}}
        - find {{.OUTPUTFOLDER}} -maxdepth 1 -name "*.ttl" -delete
        - mkdir -p /logs
        - "[ -f /logs/mapping-log.log ] || touch /logs/mapping-log.log"
        - "[ -f /logs/log_marker_line ] || echo 0 > /logs/log_marker_line"
        - |
          last_line=$(cat /logs/log_marker_line)
          bash performMapping.sh -i {{.INPUTFOLDER}} -o {{.OUTPUTFOLDER}} -m {{.MAPPINGFILE}} -g {{.GENERATOR_POLICY}} -j {{.X3ML_ENDPOINT}}
          new_total_lines=$(wc -l < /logs/mapping-log.log)
          start_line=$((last_line + 1))
          if [ "$new_total_lines" -ge "$start_line" ]; then
            sed -n "${start_line},${new_total_lines}p" /logs/mapping-log.log | grep -iaE 'error|exception' || true
          fi
          
          # Truncate the log file to the last MAX_MAPPING_LOG_LINES lines
          tail -n {{.MAX_MAPPING_LOG_LINES}} /logs/mapping-log.log > /logs/mapping-log.log.temp && mv /logs/mapping-log.log.temp /logs/mapping-log.log
          
          new_total_lines=$(wc -l < /logs/mapping-log.log)
          echo $new_total_lines > /logs/log_marker_line        
        
        - echo "Full mapping log output /log/mapping-log.log"

        - find {{.INPUTFOLDER}} -maxdepth 1 -name "*.xml" -delete

        - echo "Done for now..."

    
# RESET FUNCTIONS
  reset:
    desc: Delete all artefacts produced by the pipeline.
    prompt: This will delete all artefacts produced by the pipeline... Do you want to continue?
    cmds:
      - rm -f /scripts/.task/checksum/*
      - for:
        - xxx
        task: reset-module
        vars:
          MODULE: "{{.ITEM}}"
      - echo "Done!"

  reset-module:
    desc: Delete all artefacts produced by the pipeline for a given module. The module name should be passed as an argument or via the MODULE variable.
    silent: true
    vars:
      MODULE:
        sh: |
          if [ -z "{{.MODULE}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            echo "{{.MODULE}}"
          fi
      MODULE_LOWERCASE:
        sh: echo "$(echo "{{.MODULE}}" | awk '{print tolower($0)}')"
    cmds:
      - |
        if [ -z "{{.MODULE}}" ]; then
          echo "No module specified as variable or cli argument. Exiting script."
          exit 1
        fi
      - echo "Deleting files for {{.MODULE}}..."
      - rm -rf /dts_source/registers
      - rm -rf /dts_source/s0*
      - rm -rf /dts_source/catalog/hwgw-edition/*.xml
      - rm -rf /dts_data/catalog/hwgw-edition/*.xml
      - rm -rf /dts_data/tei/hwgw-edition
      - rm -rf /mapping/input/{{.MODULE_LOWERCASE}}
      - rm -rf /mapping/output/{{.MODULE_LOWERCASE}}
