version: '3'

vars:
  BLAZEGRAPH_ENDPOINT: http://blazegraph:8080/blazegraph/sparql
  X3ML_ENDPOINT: http://localhost:8089/transform
  GENERATOR_POLICY: /mapping/generator-policy.xml
  NAMESPACE: http://hwgw.uzh.ch/
  REGISTERS: bibliography,objects,organizations,persons,places
  SCHRIFTEN: 01,03,04 # 01,02,03,04,06,08
  SOURCE_FOLDER: /dts_source
  DTS_FOLDER: /dts_data
  MODULES: objects,organizations,persons,places

dotenv: 
  - /.env


tasks:
  default:
    desc: Default task
    silent: true
    interactive: true
    cmds:
      - task: download-all-data
      - task: prepare-dts-catalog-data
      - task: prepare-and-perform-mapping-for-items
      # - task: ingest-items
      # - task: ingest-ontologies

  
  download-all-data:
    desc: Download all data from GitHub
    interactive: true
    vars:
      DOWNLOAD_WHAT: "all"
    cmds:
      - echo "Downloading all data from GitHub..."
      - mkdir -p {{.SOURCE_FOLDER}}
      - echo "Downloading Schriften..."
      - for:
          var: SCHRIFTEN
          split: ','
          as: SCHRIFT
        task: _download_individual_schrift_file_from_github
        vars:
          FILE_TYPE: "{{.SCHRIFT}}"
          PARTS: app,app-notiz,ed,in
      - echo "Downloading REGISTERS..."
      - for:
          var: REGISTERS
          split: ','
          as: REGISTER
        task: _download_individual_register_file_from_github
        vars:
          FILE_TYPE: "{{.REGISTER}}"

  _download_individual_register_file_from_github:
    internal: true
    silent: true
    requires:
      vars: [FILE_TYPE]
    vars:
      FILEPATH: "hw-anno/data/registers/{{.FILE_TYPE}}.xml" # ex. hw-anno/data/registers/bibliography.xml
      LOCAL_FOLDER: "{{.SOURCE_FOLDER}}/registers" # ex. /dts_source/registers
      LOCAL_PATH: "{{.LOCAL_FOLDER}}/{{.FILE_TYPE}}.xml" # ex. /dts_source/bibliography.xml
    cmds:
      - mkdir -p {{.LOCAL_FOLDER}}
      - python getFileContentsFromGit.py {{.GITHUB_USERNAME}} {{.GITHUB_PERSONAL_ACCESS_TOKEN}} biblhertz/hwgw-anno-data {{.FILEPATH}} {{.LOCAL_PATH}} staging


  _download_individual_schrift_file_from_github:
    internal: true
    requires:
      vars: [FILE_TYPE, PARTS]
    cmds:
      - for:
          var: PARTS
          split: ','
          as: PART
        task: _download_individual_schrift_part_file_from_github
        vars:
          PART: "{{.PART}}"
          FILE_TYPE: "{{.FILE_TYPE}}"

  _download_individual_schrift_part_file_from_github:
    internal: true
    silent: true
    requires:
      vars: [FILE_TYPE, PART]
    vars:
      FILEPATH: "hw-anno/data/s{{.FILE_TYPE}}/s{{.FILE_TYPE}}-{{.PART}}.xml" # ex. hw-anno/data/s01/s01-app.xml
      LOCAL_FOLDER: "{{.SOURCE_FOLDER}}/s{{.FILE_TYPE}}" # ex. /dts_source/s01
      LOCAL_PATH: "{{.LOCAL_FOLDER}}/s{{.FILE_TYPE}}-{{.PART}}.xml" # ex. /dts_source/s01/s01-app.xml
    cmds:
      - mkdir -p {{.LOCAL_FOLDER}}
      - python getFileContentsFromGit.py {{.GITHUB_USERNAME}} {{.GITHUB_PERSONAL_ACCESS_TOKEN}} biblhertz/hwgw-anno-data {{.FILEPATH}} {{.LOCAL_PATH}} staging

  download-mapping-files-from-3M:
    desc: Downloads the mapping file from the 3M
    cmds:
      - echo "Downloading mapping files..."
      - for:
          var: MODULES
          split: ','
          as: MODULE
        task: _download_individual_mapping_file_from_3M
        vars:
          MODULE: "{{.MODULE}}"

  _download_individual_mapping_file_from_3M:
    internal: true
    requires:
      vars: [MODULE]
    vars:
        MAPPING_ID:
          sh: awk -F, '$1 == "{{.MODULE}}" {print $2}' {{.MAPPING_TABLE}}
        MAPPINGFILE:
          sh: echo "/mapping/mapping-$(echo "{{.MODULE}}" | awk '{print tolower($0)}').x3ml"  
    cmds:
      - wget -q -O {{.MAPPINGFILE}} "https://3m-export.swissartresearch.net/mapping/{{.MAPPING_ID}}"

# MAPPING
  prepare-and-perform-mapping-for-items:
    desc: Prepares and performs the mapping for all modules
    # MAPPING_INPUTFOLDER:
    #   sh: echo "/mapping/input"
    cmds:
      # - echo "Preparing mapping..."
      # - task: _prepare-mapping-for-module-items
      #   vars:
      #     MODULE: "all"
      - echo "Mapping..."
      - echo "" > /logs/mapping-log.log
      - for:
          var: MODULES
          split: ','
          as: MODULE
        task: _perform-mapping-for-module-items
        vars:
          MODULE: "{{.MODULE}}"
      # - find {{.MAPPING_INPUTFOLDER}} -maxdepth 1 -name "*.xml" -delete


  # prepare-mapping-for-module-items:
  #   desc: Prepares the mapping for a specific module. The module name should be passed as an argument or via the MODULE variable.
  #   interactive: True
  #   vars:
  #     MODULE:
  #       sh: |
  #         if [ -z "{{.MODULE}}" ]; then
