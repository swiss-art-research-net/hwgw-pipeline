# the Linux host-gateway mapping lets the `jobs` RDS enrichment
# task (dts-add-rds-links) reach host.docker.internal:8000.

services:
  jobs:
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dapytains:
    networks:
      - internal
      - proxy

  qlever:
    networks:
      - internal
      - proxy

  qlever-ui:
    networks:
      - internal
      - proxy

networks:
  internal:
  proxy:
    name: ${PROXY_NETWORK_NAME}
    external: true
